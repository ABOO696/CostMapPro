services:

  postgres:
    image: postgres:16

  api:
    build: .

    command: >
      uvicorn
      app.api.main:app
      --host 0.0.0.0
      --port 8000

    depends_on:
      - postgres

  streamlit:
    build: .

    command: >
      streamlit run app.py

    ports:
      - "8501:8501"

    depends_on:
      - api