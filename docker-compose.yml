services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: costmap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  streamlit:
    build: .

    env_file:
      - .env

    ports:
      - "8501:8501"

    depends_on:
      - postgres

volumes:
  postgres_data:
